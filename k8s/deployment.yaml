apiVersion: apps/v1
kind: Deployment
metadata:
  name: bibliotecatecedu-modulo
  labels:
    app: bibliotecatecedu-modulo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bibliotecatecedu-modulo
  template:
    metadata:
      labels:
        app: bibliotecatecedu-modulo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8084"
    spec:
      containers:
        - name: bibliotecatecedu-modulo
          image: bibliotecatecedu-modulo:local
          ports:
            - containerPort: 8084
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: bibliotecatecedu-modulo-svc
spec:
  selector:
    app: bibliotecatecedu-modulo
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP

